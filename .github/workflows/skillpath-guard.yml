# Independent consumer test of SkillPath Guard (main). Expected outcome of each job is in its name.
name: skillpath-guard-consumer-test
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  valid-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ClarrieO5/skillpath-guard@main
        with: { path: skills/good-skill }
  broken-fails:
    name: broken-fails (green means the Action step failed as expected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scan
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        with: { path: broken }
      - run: test "${{ steps.scan.outcome }}" = "failure"
  shared-default-fails-allow-shared-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: off
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        with: { path: . , exclude: "broken\nvendored" }
      - run: test "${{ steps.off.outcome }}" = "failure"
      - uses: ClarrieO5/skillpath-guard@main
        with:
          path: .
          allow-shared: 'true'
          exclude: |
            broken
            vendored
  exclude-works:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: noexclude
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        with: { path: vendored }
      - run: test "${{ steps.noexclude.outcome }}" = "failure"
      - uses: ClarrieO5/skillpath-guard@main
        with:
          path: .
          allow-shared: 'true'
          exclude: |
            broken
              vendored
  summary-on-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The runner consumes and deletes each step's summary file when the step ends, so a later step cannot
      # read it. A background watcher copies the file while it exists (best effort, polling every 5 ms).
      - name: start summary watcher
        run: |
          nohup bash -c 'while true; do for f in on off; do p="$RUNNER_TEMP/summary-$f.md"; if [ -s "$p" ]; then cp "$p" "$RUNNER_TEMP/captured-$f.md" 2>/dev/null; fi; done; sleep 0.005; done' >/dev/null 2>&1 &
          echo $! > "$RUNNER_TEMP/watcher.pid"
      - name: summary default (on)
        id: on
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/summary-on.md
        with: { path: broken }
      - name: summary off
        id: off
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/summary-off.md
        with: { path: broken, summary: 'false' }
      - name: check what the watcher captured
        run: |
          sleep 0.3; kill "$(cat "$RUNNER_TEMP/watcher.pid")" || true
          ls -l "$RUNNER_TEMP"/captured-*.md || true
          test "${{ steps.on.outcome }}" = "failure"
          test "${{ steps.off.outcome }}" = "failure"
          echo "--- captured with summary on:"; cat "$RUNNER_TEMP/captured-on.md"
          grep -q MISSING_REFERENCE "$RUNNER_TEMP/captured-on.md"
          echo "--- summary off: must have captured nothing"
          test ! -e "$RUNNER_TEMP/captured-off.md"
