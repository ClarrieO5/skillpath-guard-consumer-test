# Independent consumer test of SkillPath Guard (main). Expected outcome of each job is in its name.
name: skillpath-guard-consumer-test
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  valid-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ClarrieO5/skillpath-guard@main
        with: { path: skills/good-skill }
  broken-fails:
    name: broken-fails (green means the Action step failed as expected)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: scan
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        with: { path: broken }
      - run: test "${{ steps.scan.outcome }}" = "failure"
  shared-default-fails-allow-shared-passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: off
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        with: { path: . , exclude: "broken\nvendored" }
      - run: test "${{ steps.off.outcome }}" = "failure"
      - uses: ClarrieO5/skillpath-guard@main
        with:
          path: .
          allow-shared: 'true'
          exclude: |
            broken
            vendored
  exclude-works:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: noexclude
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        with: { path: vendored }
      - run: test "${{ steps.noexclude.outcome }}" = "failure"
      - uses: ClarrieO5/skillpath-guard@main
        with:
          path: .
          allow-shared: 'true'
          exclude: |
            broken
              vendored
  summary-on-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # GitHub gives every step its own GITHUB_STEP_SUMMARY file, so a later step cannot read what the
      # Action wrote. Point the variable at a shared file on the Action steps to be able to read it back.
      - name: summary default (on) writes a report
        id: on
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/summary-on.md
        with: { path: broken }
      - name: summary on produced the report
        run: |
          ls -l "$RUNNER_TEMP"/summary-*.md || true
          test -s "$RUNNER_TEMP/summary-on.md"
          grep -q MISSING_REFERENCE "$RUNNER_TEMP/summary-on.md"
          cat "$RUNNER_TEMP/summary-on.md"
      - id: off
        name: summary off
        continue-on-error: true
        uses: ClarrieO5/skillpath-guard@main
        env:
          GITHUB_STEP_SUMMARY: ${{ runner.temp }}/summary-off.md
        with: { path: broken, summary: 'false' }
      - name: summary off wrote nothing
        run: |
          test "${{ steps.off.outcome }}" = "failure"
          test ! -s "$RUNNER_TEMP/summary-off.md"
